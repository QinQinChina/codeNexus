appId: com.codenexus.desktop
productName: CodeNexus

publish:
  provider: github
  owner: QinQinChina
  repo: codeNexus
  releaseType: release
  channel: latest

directories:
  buildResources: build
  output: release

asar: true

files:
  - from: .
    to: .
    filter:
      - package.json
  - from: dist
    to: dist
    filter:
      - "**/*"
      - "!renderer/**"

extraResources:
  - from: music
    to: music
    filter:
      - "**/*"
  - from: build/icon.ico
    to: icon.ico
  - from: D:/Development/CodeNexus/native-runtime
    to: codex-runtime
    filter:
      - codex-app-server.exe
  - from: D:/Development/CodeNexus/native-runtime
    to: gigma-runtime
    filter:
      - gigma.exe

win:
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
